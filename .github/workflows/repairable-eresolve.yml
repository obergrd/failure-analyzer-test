name: Repairable npm ERESOLVE fixture

on:
  workflow_dispatch:
  push:
    branches:
      - test/mcp-repair-eresolve

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install repairable ERESOLVE fixture dependencies
        run: npm install --prefix fixtures/repairable-eresolve
