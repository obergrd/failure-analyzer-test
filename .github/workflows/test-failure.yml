name: Failure analyzer real fixtures

on:
  workflow_dispatch:

jobs:
  typescript-ts2307:
    runs-on: ubuntu-latest
    steps:
      - name: Compile a project with a missing import
        run: |
          mkdir fixture && cd fixture
          printf "import missing from 'module-that-does-not-exist';\nconsole.log(missing);\n" > broken.ts
          printf '{"compilerOptions":{"module":"commonjs","moduleResolution":"node","noEmit":true},"files":["broken.ts"]}\n' > tsconfig.json
          npm exec --yes --package=typescript@5.7.3 -- tsc -p tsconfig.json
  cmake-find-package:
    runs-on: ubuntu-latest
    steps:
      - name: Configure a project with a missing package
        run: |
          mkdir fixture && cd fixture
          printf 'cmake_minimum_required(VERSION 3.20)\nproject(FailureFixture)\nfind_package(MissingLib REQUIRED CONFIG)\n' > CMakeLists.txt
          cmake -S . -B build
  npm-eresolve:
    runs-on: ubuntu-latest
    steps:
      - name: Install conflicting peer dependencies
        run: |
          mkdir fixture && cd fixture
          npm init --yes
          npm install --strict-peer-deps react@18.2.0 react-dom@17.0.2
  multiple-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Produce primary and secondary TypeScript diagnostics
        run: |
          mkdir fixture && cd fixture
          printf "import missing from 'module-that-does-not-exist';\nconst mustBeNumber: number = 'secondary';\nconsole.log(missing);\n" > broken.ts
          printf '{"compilerOptions":{"module":"commonjs","moduleResolution":"node","noEmit":true},"files":["broken.ts"]}\n' > tsconfig.json
          npm exec --yes --package=typescript@5.7.3 -- tsc -p tsconfig.json
  succeeds:
    runs-on: ubuntu-latest
    steps:
      - run: node --version
