name: Repairable CMake fixture

on:
  workflow_dispatch:
  push:
    branches:
      - test/mcp-repair-cmake

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure repairable CMake fixture
        run: cmake -S fixtures/repairable-cmake -B build/repairable-cmake
